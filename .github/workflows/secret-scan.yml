# Secret scanning for every repository (XCT-SEC-005; XCT-SEC PRD question 4, decision 107: gitleaks, pinned, as a CI
# step from these templates, because GitHub's own secret scanning for private repositories is not on the Free plan).
#
# Use it by copying this file into the repository's .github/workflows/ unchanged, as the other templates here are
# used (no repository calls a dhruva-infra workflow across repositories today). dhruva-infra runs its own copy:
# .github/workflows/secret-scan.yml. Keep the copies in step when the pinned version changes.
#
# What it does, on every pull request and every push to main (no path filter: a secret can be in any file):
# 1. Installs gitleaks at a pinned version, checked against the release asset's SHA-256.
# 2. "XCT-SEC-005: planted secret fails the build": writes a freshly generated, fake AWS key id to a temporary folder
#    outside the checkout and requires gitleaks to fail on it (exit code 1), so a scanner that silently finds nothing
#    turns the build red. The fake value is made at run time and never committed.
# 3. Scans the repository's whole git history (fetch-depth 0); any finding fails the build. Findings are redacted in
#    the log. A false positive goes into a `.gitleaks.toml` allow-list in that repository, with a comment saying why.
#
# Upgrading gitleaks: take the version and the linux_x64 tarball's sha256 from the release page
# (`gh release view v<version> --repo gitleaks/gitleaks --json assets`), in a pull request of its own.
name: secret-scan
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb" # gitleaks_8.30.1_linux_x64.tar.gz
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 } # the whole history, not only the last commit
      - name: Install gitleaks (pinned, checksum verified)
        run: |
          tarball="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -sSfL -o "$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $tarball" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$tarball" -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: "XCT-SEC-005: planted secret fails the build"
        run: |
          planted="$RUNNER_TEMP/planted"
          mkdir -p "$planted"
          # A random, fake AWS access key id (AKIA + 16 characters of A-Z and 2-7), made now and never committed.
          key="AKIA$(head -c 4096 /dev/urandom | LC_ALL=C tr -dc 'A-Z2-7' | cut -c1-16)"
          printf 'aws_access_key_id = %s\n' "$key" > "$planted/config"
          set +e
          gitleaks dir "$planted" --no-banner --redact
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "::error::gitleaks did not report the planted secret (exit code $code, expected 1)"
            exit 1
          fi
          echo "The planted secret was found, as it should be."
      - name: Scan the git history
        run: gitleaks git . --no-banner --redact --verbose
